<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>MDC Class Changes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap">
<style>
/* Layout: white MDC header with logo top-left; below it a 2-column workspace (schedule left, requests + updates right) that stacks on phones. */
:root{
  --bg:#F2F6FA; --surface:#FFFFFF; --fg:#0E2237; --muted:#4F6378; --line:#D6E1EB;
  --blue:#0065B3; --navy:#003A6B; --tint:#E6F0F9; --accent:#0065B3;
  --btn:#0065B3; --btn-fg:#FFFFFF; --btn-hover:#004E8C;
  --hdr:#FFFFFF; --hdr-line:#0065B3;
  --ok:#17713F; --ok-bg:#E1F3E8; --warn:#7A4E00; --warn-bg:#FFF0D1; --bad:#B3261E; --bad-bg:#FBE5E3; --info-bg:#E6F0F9;
  --shadow:0 1px 2px rgba(0,40,80,.08),0 4px 14px rgba(0,40,80,.06);
  --f-display:'Lora',Georgia,serif; --f-body:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1624; --surface:#112338; --fg:#E8F0F8; --muted:#9DB2C7; --line:#25415E;
  --blue:#6DB5F2; --navy:#9CCBF5; --tint:#173A5C; --accent:#7DBEF5;
  --btn:#1F78C8; --btn-fg:#FFFFFF; --btn-hover:#2F8BDA; --hdr:#0D2A47; --hdr-line:#3B8FE0;
  --ok:#6FD39B; --ok-bg:#12331F; --warn:#F2C46B; --warn-bg:#3A2C0C; --bad:#FF9D96; --bad-bg:#40191A; --info-bg:#14304D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1624; --surface:#112338; --fg:#E8F0F8; --muted:#9DB2C7; --line:#25415E;
  --blue:#6DB5F2; --navy:#9CCBF5; --tint:#173A5C; --accent:#7DBEF5;
  --btn:#1F78C8; --btn-fg:#FFFFFF; --btn-hover:#2F8BDA; --hdr:#0D2A47; --hdr-line:#3B8FE0;
  --ok:#6FD39B; --ok-bg:#12331F; --warn:#F2C46B; --warn-bg:#3A2C0C; --bad:#FF9D96; --bad-bg:#40191A; --info-bg:#14304D;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.25}
h2{font-size:1.35rem;font-weight:600}
p{margin:0}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* header */
.hdr{background:var(--hdr);border-bottom:4px solid var(--hdr-line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.hdr-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo-tile{background:#fff;border-radius:6px;padding:2px;line-height:0;flex:none}
.logo img{width:62px;height:auto;display:block}
.logo-t{font-family:var(--f-display);font-weight:600;font-size:1.15rem;color:var(--navy);line-height:1.2}
.logo-t small{display:block;font-family:var(--f-body);font-weight:400;font-size:.8rem;color:var(--muted)}
.hdr-r{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs,.seg{display:flex;background:var(--tint);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.tabs button,.seg button{border:0;background:transparent;border-radius:999px;padding:8px 16px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-fg)}
.who{font-size:.85rem;color:var(--muted);text-align:right;line-height:1.3}
.who b{display:block;color:var(--fg);font-weight:600}

/* prototype bar */
.proto{background:#003A6B;color:#fff}
.proto-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;font-size:.82rem}
.proto .seg{background:rgba(255,255,255,.16);padding:3px}
.proto .seg button{color:#fff;padding:5px 12px;font-size:.8rem}
.proto .seg button[aria-pressed="true"]{background:#fff;color:#003A6B}
.proto .lnk{margin-left:auto;background:none;border:0;color:#fff;text-decoration:underline;cursor:pointer;font-size:.8rem}

main{max-width:1180px;margin:0 auto;padding:24px 16px 56px;display:grid;gap:24px}
.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:24px;min-width:0}

.banner{display:flex;gap:14px;align-items:flex-start;padding:14px 18px;border-radius:12px;background:var(--info-bg);border:1px solid var(--line)}
.banner.late{background:var(--warn-bg);border-color:transparent}
.banner .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--ok);margin-top:7px}
.banner.late .dot{background:var(--warn)}
.banner b{display:block}
.banner span{color:var(--muted);font-size:.9rem}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 12px;flex-wrap:wrap}
.panel-h p{color:var(--muted);font-size:.88rem}
.panel-b{padding:4px 20px 20px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:2px solid var(--btn);background:var(--btn);color:var(--btn-fg);padding:10px 18px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{background:var(--btn-hover);border-color:var(--btn-hover)}
.btn.ghost{background:transparent;color:var(--accent);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--accent);background:var(--tint)}
.btn.danger{background:transparent;color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:6px 14px;min-height:36px;font-size:.88rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* schedule */
.course{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;padding:16px 0;border-top:1px solid var(--line);align-items:center}
.course:first-child{border-top:0}
.c-code{font-weight:600;color:var(--navy)}
.c-name{font-weight:500}
.c-meta{color:var(--muted);font-size:.85rem}
.c-act{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:560px){.course{grid-template-columns:minmax(0,1fr)}}
.credits{display:flex;gap:18px;color:var(--muted);font-size:.88rem;padding-top:14px;border-top:1px solid var(--line);flex-wrap:wrap}
.credits b{color:var(--fg)}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:500;background:var(--tint);color:var(--fg);white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}

/* requests */
.req{border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:8px;background:var(--surface)}
.req+.req{margin-top:12px}
.req-top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;flex-wrap:wrap}
.req-title{font-weight:600}
.req-id{color:var(--muted);font-size:.78rem}
.now{font-size:.9rem;color:var(--muted)}
.now b{color:var(--fg);font-weight:600}
details summary{cursor:pointer;color:var(--accent);font-size:.88rem;font-weight:500;padding:4px 0}
.tl{list-style:none;margin:8px 0 0;padding:0}
.tl li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;padding-bottom:14px;position:relative;font-size:.88rem}
.tl li:not(:last-child)::before{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.tl i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;font-style:normal;font-size:.7rem;font-weight:700}
.tl .done i{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.tl .act i{border-color:var(--accent);background:var(--tint);color:var(--accent)}
.tl .no i{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.tl .skip{opacity:.55}
.tl small{display:block;color:var(--muted)}
.audit{margin:6px 0 0;padding:0;list-style:none;font-size:.8rem;color:var(--muted);display:grid;gap:3px}
.confirm{background:var(--warn-bg);border-radius:10px;padding:12px 14px;display:grid;gap:10px;font-size:.9rem}
.confirm .row{display:flex;gap:8px;flex-wrap:wrap}
.result{font-size:.9rem;background:var(--ok-bg);color:var(--ok);padding:8px 12px;border-radius:8px}
.result.bad{background:var(--bad-bg);color:var(--bad)}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}

/* notifications */
.note{display:grid;grid-template-columns:10px minmax(0,1fr);gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:.9rem}
.note:first-child{border-top:0}
.note .u{width:10px;height:10px;border-radius:50%;margin-top:7px;background:transparent}
.note.new .u{background:var(--accent)}
.note time{display:block;color:var(--muted);font-size:.78rem}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,20,36,.55);z-index:40;display:grid;place-items:start center;overflow-y:auto;padding:24px 16px}
.modal{background:var(--surface);color:var(--fg);border-radius:16px;max-width:680px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.35);margin-block:auto}
.m-h{padding:20px 24px 12px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.x{border:0;background:var(--tint);width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.2rem;color:var(--fg);flex:none}
.m-b{padding:8px 24px 20px;display:grid;gap:16px}
.m-f{padding:16px 24px 24px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
.opt{display:grid;grid-template-columns:24px minmax(0,1fr);gap:12px;border:2px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;align-items:start}
.opt:has(input:checked){border-color:var(--accent);background:var(--tint)}
.opt:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.opt input{width:20px;height:20px;margin:3px 0 0;accent-color:var(--blue)}
.opts{display:grid;gap:10px}
.sum{background:var(--tint);border-radius:12px;padding:14px 16px;display:grid;gap:8px}
.sum div{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px;font-size:.92rem}
.sum span{color:var(--muted)}
.why{border-radius:12px;padding:14px 16px;background:var(--warn-bg);display:grid;gap:6px;font-size:.92rem}
.why.good{background:var(--ok-bg)}
.route{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.route .chip{font-size:.85rem;padding:5px 12px}
.route .arrow{color:var(--muted)}
label.f{display:grid;gap:6px;font-weight:500;font-size:.9rem}
textarea{width:100%;min-height:84px;border:2px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);resize:vertical}
.stepper{font-size:.8rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:500}

/* approver */
.alert{background:var(--warn-bg);border-radius:10px;padding:10px 14px;font-weight:500;font-size:.92rem}
.ap{display:grid;gap:12px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--surface)}
.ap+.ap{margin-top:14px}
.ap-act{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:#003A6B;color:#fff;padding:12px 20px;border-radius:12px;z-index:60;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:calc(100% - 32px);font-size:.92rem}
.scope{font-size:.82rem;color:var(--muted);text-align:center;padding-top:8px}
@media (prefers-reduced-motion:no-preference){.modal{animation:up .18s ease-out}@keyframes up{from{transform:translateY(10px);opacity:.4}to{transform:none;opacity:1}}}


</style>

 {code:'HUM 2020',name:'Humanities Survey',sec:'4125',time:'Online, self-paced',campus:'Virtual College',inst:'Prof. Nguyen',cr:3}
];
const CAT=[
 {code:'BSC 1010',name:'Biology I',sec:'5120',time:'Mon, Wed 1:00 to 2:15 PM',campus:'Kendall Campus',inst:'Prof. Reyes',cr:3,seats:30,cap:30},

 {code:'CHM 1045',name:'General Chemistry I',sec:'5522',time:'Mon, Wed 3:00 to 4:15 PM',campus:'Kendall Campus',inst:'Prof. Silva',cr:3,seats:18,cap:30,hold:'Department hold (Natural Sciences)'},
 {code:'PSY 2012',name:'General Psychology',sec:'5344',time:'Mon, Wed 11:00 AM to 12:15 PM',campus:'Kendall Campus',inst:'Prof. Haddad',cr:3,seats:27,cap:35},
 {code:'STA 2023',name:'Statistics I',sec:'5410',time:'Tue, Thu 1:00 to 2:15 PM',campus:'Wolfson Campus',inst:'Prof. Barros',cr:3,seats:31,cap:40}
];
const ALL=[...CUR,...CAT]; const get=c=>ALL.find(x=>x.code===c);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const KEY='mdc-class-changes-v1';
let S, W=null, toastT;

function fresh(){
  S={sim:'before',view:'student',role:'chair',seq:1042,courses:CUR.map(c=>c.code),reqs:[],notes:[]};
  S.notes.push({t:'Welcome. Your requests and decisions will appear here.',d:'Aug 31',n:false});
  submit('add',null,'BSC 1010','I need Biology I to stay on track for my nursing prerequisites.',true);
  S.notes.forEach(n=>n.n=false);
}
function load(){try{const j=localStorage.getItem(KEY);if(j){S=JSON.parse(j);return}}catch(e){}fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const dateLabel=()=>S.sim==='before'?'Aug 31':'Oct 8';
const isLate=()=>S.sim==='after';

function blockers(c){const b=[];if(!c)return b;
  if(c.cap&&c.seats>=c.cap)b.push('Class is full ('+c.seats+'/'+c.cap+')');
  if(c.prereq)b.push('Prerequisite missing: '+c.prereq);
  if(c.hold)b.push(c.hold);return b}
function enrolled(){return S.courses.map(get)}
function credits(){return enrolled().reduce((a,c)=>a+c.cr,0)}
const step=(role,course)=>({role,name:role==='instructor'?'Instructor, '+get(course).inst:ROLES[role],state:'waiting'});

function route(type,drop,add,late){
  const a=add?get(add):null,d=drop?get(drop):null,bl=blockers(a);
  if(type==='add'){
    if(late)return{sc:'A3',steps:[step('instructor',add)],
      why:'The 100% refund deadline ('+DEADLINE+') has passed, so this is a late registration. Only the instructor of '+add+' needs to approve it.'};
    if(bl.length)return{sc:'A1',steps:[step('chair')],
      why:'You cannot add this class on your own because: '+bl.join('; ').toLowerCase()+'. The department can grant an override.'};
    return{sc:'direct',steps:[],why:'This class is open and you meet the requirements. No approval is needed.'};
  }
  if(type==='drop'){
    if(late)return{sc:'D3',steps:[step('dean')],
      why:'The 100% refund deadline ('+DEADLINE+') has passed. A drop with a refund needs a one-time exception from the Dean of Students.'};
    if(d.hold)return{sc:'D1',steps:[step('chair')],
      why:'A department hold stops you from dropping this class yourself. The Chair or Advisor can lift the hold for this class only.'};
    return{sc:'direct',steps:[],why:'You are inside the 100% refund window and have no holds. No approval is needed.'};
  }
  if(late)return{sc:'S3',steps:[step('instructor',add),step('dean')],
    why:'The 100% refund deadline ('+DEADLINE+') has passed. The instructor of '+add+' approves the late admission first, then the Dean of Students approves moving your tuition without a penalty or a W.'};
  if(bl.length)return{sc:'S1',steps:[step('chair')],
    why:'The swap is blocked because: '+bl.join('; ').toLowerCase()+'. The department for '+add+' can authorize an override.'};
  return{sc:'direct',steps:[],why:'The new class is open and you meet the requirements. No approval is needed.'};
}

function title(r){
  if(r.type==='add')return 'Add '+r.add;
  if(r.type==='drop')return 'Drop '+r.drop;
  return 'Swap '+r.drop+' for '+r.add}
const log=(r,t)=>r.audit.push(r.date+': '+t);
const notify=t=>S.notes.unshift({t,d:dateLabel(),n:true});

function submit(type,drop,add,note,sample){
  const rt=route(type,drop,add,isLate());
  const r={id:'REQ-'+(S.seq++),type,drop,add,late:isLate(),sc:rt.sc,date:dateLabel(),note:note||'',sample:!!sample,
    steps:rt.steps,status:'pending',audit:[],outcome:''};
  log(r,'Submitted by student');
  if(!r.steps.length){log(r,'No approval needed');finish(r)}
  else{r.steps[0].state='active';log(r,'Routed to '+r.steps[0].name);
    notify(title(r)+' sent to '+r.steps[0].name+' for review.')}
  S.reqs.unshift(r);return r}

function enroll(c){if(!S.courses.includes(c))S.courses.push(c)}
function unenroll(c){S.courses=S.courses.filter(x=>x!==c)}
function finish(r){
  if(r.type==='add'){enroll(r.add);log(r,'Enrollment added in the SIS (simulated)');
    r.outcome='You are enrolled in '+r.add+'. A confirmation with the syllabus and Canvas link was sent.'}
  else if(r.type==='drop'){unenroll(r.drop);log(r,'Class dropped in the SIS (simulated)');
    r.outcome=r.sc==='D3'?'Dropped '+r.drop+' with a 100% refund override.':'Dropped '+r.drop+' with a 100% refund.'}
  else{enroll(r.add);log(r,'Step 1: '+r.add+' added');unenroll(r.drop);log(r,'Step 2: '+r.drop+' dropped');
    log(r,'Tuition balance transferred to '+r.add);
    r.outcome='Swap complete. You are in '+r.add+', '+r.drop+' was dropped, and your tuition moved to the new class with no penalty or W.'}
  r.status='completed';notify(title(r)+': '+r.outcome)}
function alts(except){
  return CAT.filter(c=>c.code!==except&&!S.courses.includes(c.code)&&!blockers(c).length)
    .map(c=>c.code+' (section '+c.sec+', '+(c.cap-c.seats)+' seats open)').slice(0,3)}
function deny(r,st,reason){
  const why=reason?' Reason: '+reason:'';
  if(r.sc==='D3'){r.status='needs';
    notify('The Dean did not approve a refund for '+r.drop+'.'+why+' If you continue, it will be a W with no refund. Your confirmation is needed.');return}
  r.status='denied';
  if(r.type==='drop'){r.outcome='Not approved. You remain enrolled in '+r.drop+'.'+why;notify(title(r)+' was not approved.'+why)}
  else{const al=alts(r.add);
    r.outcome=(r.type==='swap'?'Swap not approved. You stay in '+r.drop+'.':'Add not approved.')+why+(al.length?' Other open sections: '+al.join('; ')+'.':'');
    notify(title(r)+' was not approved.'+why+(al.length?' Open options: '+al.join('; ')+'.':''))}}

function decide(id,ok,reason){
  const r=S.reqs.find(x=>x.id===id);if(!r)return;
  const st=r.steps.find(s=>s.state==='active');if(!st)return;
  st.note=reason;log(r,st.name+(ok?' approved':' denied')+(reason?' ('+reason+')':''));
  if(ok){st.state='approved';const nx=r.steps.find(s=>s.state==='waiting');
    if(nx){nx.state='active';log(r,'Routed to '+nx.name);notify(title(r)+' approved by '+st.name+'. Now with '+nx.name+'.')}
    else finish(r)}
  else{st.state='denied';r.steps.forEach(s=>{if(s.state==='waiting')s.state='skipped'});deny(r,st,reason)}
  save();render();toast(ok?'Decision recorded: approved':'Decision recorded: denied')}
function reassign(id){
  const r=S.reqs.find(x=>x.id===id),st=r.steps.find(s=>s.state==='active');
  st.alt=true;log(r,'Approver unavailable. Rerouted to an authorized alternate for '+st.name);
  notify(title(r)+' moved to an alternate '+st.name+' so it keeps moving.');save();render();toast('Rerouted to an alternate approver')}
function studentConfirm(id,yes){
  const r=S.reqs.find(x=>x.id===id);
  if(yes){unenroll(r.drop);r.status='completed';r.outcome='Dropped '+r.drop+' as a W (withdrawal) with no refund.';log(r,'Student confirmed withdrawal with a W');notify(r.outcome)}
  else{r.status='cancelled';r.outcome='Request cancelled. You remain enrolled in '+r.drop+'.';log(r,'Student cancelled the request');notify(r.outcome)}
  save();render();toast(yes?'Withdrawal confirmed':'Request cancelled')}

/* ---------- views ---------- */
const STAT={pending:['In review',''],completed:['Completed','ok'],denied:['Not approved','bad'],needs:['Needs your answer','warn'],cancelled:['Cancelled','']};
function chip(t,c){return '<span class="chip '+(c||'')+'">'+esc(t)+'</span>'}
function seatsChip(c){if(!c.cap)return '';const open=c.cap-c.seats;
  return open<=0?chip('Full '+c.seats+'/'+c.cap,'bad'):chip(open+' seats open','ok')}

function timeline(r){
  const items=[{c:'done',i:'✓',t:'Request submitted',s:r.date}];
  r.steps.forEach(s=>{
    const m={approved:['done','✓','Approved'],denied:['no','✕','Denied'],active:['act','●','Reviewing now'],waiting:['','','Waiting'],skipped:['skip','','Not needed']}[s.state];
    items.push({c:m[0],i:m[1],t:s.name+(s.alt?' (alternate)':''),s:m[2]+(s.note?': '+s.note:'')})});
  const last={completed:['done','✓','Schedule updated'],denied:['no','✕','Schedule unchanged'],cancelled:['skip','','Cancelled'],needs:['act','●','Waiting for you']}[r.status];
  if(last)items.push({c:last[0],i:last[1],t:last[2],s:''});
  else if(r.steps.length)items.push({c:'',i:'',t:'Schedule updated',s:'After all approvals'});
  return '<ol class="tl">'+items.map(x=>'<li class="'+x.c+'"><i>'+x.i+'</i><div>'+esc(x.t)+(x.s?'<small>'+esc(x.s)+'</small>':'')+'</div></li>').join('')+'</ol>'}

function reqCard(r){
  const st=STAT[r.status],cur=r.steps.find(s=>s.state==='active');
  return '<article class="req"><div class="req-top"><div><div class="req-title">'+esc(title(r))+'</div><div class="req-id">'+r.id+' · '+r.date+(r.sample?' · sample request':'')+'</div></div>'+chip(st[0],st[1])+'</div>'
  +(r.status==='pending'&&cur?'<p class="now">Now with <b>'+esc(cur.name)+(cur.alt?' (alternate)':'')+'</b>. You will get an update here after their decision.</p>':'')
  +(r.outcome?'<p class="result '+(r.status==='denied'||r.status==='cancelled'?'bad':'')+'">'+esc(r.outcome)+'</p>':'')
  +(r.status==='needs'?'<div class="confirm"><p><b>Your choice:</b> the Dean did not approve a refund. You can still withdraw from '+esc(r.drop)+' as a <b>W</b> with no refund, or keep the class.</p><div class="row"><button class="btn sm" data-a="conf" data-id="'+r.id+'" data-v="1">Withdraw with a W</button><button class="btn ghost sm" data-a="conf" data-id="'+r.id+'" data-v="0">Keep the class</button></div></div>':'')
  +'<details><summary>See progress</summary>'+timeline(r)+'<ul class="audit">'+r.audit.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul></details></article>'}

function studentView(){
  const late=isLate();
  const banner=late
   ?'<div class="banner late"><span class="dot"></span><div><b>The 100% refund window closed on '+DEADLINE+'.</b><span>Any change now needs approval. We send it to the right person for you.</span></div></div>'
   :'<div class="banner"><span class="dot"></span><div><b>The 100% refund window is open until '+DEADLINE+'.</b><span>Changes with no holds or blocks happen right away. Anything else goes to the right approver.</span></div></div>';
  const courses=enrolled().map(c=>'<div class="course"><div><div><span class="c-code">'+c.code+'</span> · <span class="c-name">'+c.name+'</span></div>'
    +'<div class="c-meta">Section '+c.sec+' · '+c.time+' · '+c.campus+' · '+c.inst+'</div>'
    +(c.hold?'<div class="chips">'+chip(c.hold,'warn')+'</div>':'')+'</div>'
    +'<div class="c-act"><button class="btn ghost sm" data-a="wiz" data-t="swap" data-d="'+c.code+'">Swap</button><button class="btn danger sm" data-a="wiz" data-t="drop" data-d="'+c.code+'">Drop</button></div></div>').join('');
  const open=S.reqs.filter(r=>r.status==='pending'||r.status==='needs').length;
  const reqs=S.reqs.length?S.reqs.map(reqCard).join(''):'<div class="empty">No requests yet. Pick Add, Drop or Swap to start.</div>';
  const unread=S.notes.filter(n=>n.n).length;
  const notes=S.notes.slice(0,6).map(n=>'<div class="note '+(n.n?'new':'')+'"><span class="u"></span><div>'+esc(n.t)+'<time>'+n.d+'</time></div></div>').join('');
  return banner+'<div class="grid"><div class="stack">'
   +'<section class="panel"><div class="panel-h"><div><h2>My schedule</h2><p>Fall 2026 · '+S.courses.length+' classes</p></div><button class="btn" data-a="wiz" data-t="add">+ Add a class</button></div><div class="panel-b">'+courses
   +'<div class="credits"><span><b>'+credits()+'</b> credits enrolled</span><span>Refund deadline <b>'+DEADLINE+'</b></span></div></div></section></div>'
   +'<div class="stack"><section class="panel"><div class="panel-h"><div><h2>My requests</h2><p>'+(open?open+' waiting':'Nothing waiting')+'</p></div></div><div class="panel-b">'+reqs+'</div></section>'
   +'<section class="panel"><div class="panel-h"><div><h2>Updates</h2><p>'+(unread?unread+' new':'You are all caught up')+'</p></div>'+(unread?'<button class="btn ghost sm" data-a="read">Mark as read</button>':'')+'</div><div class="panel-b">'+notes+'</div></section></div></div>'
   +'<p class="scope">Sample data only. Enrollment changes are simulated and no real student records are used.</p>'}

function askText(r,st){
  const a=r.add?get(r.add):null;
  if(st.role==='instructor'){
    const full=a&&a.cap&&a.seats>=a.cap;
    if(full)return '<div class="alert">Class at capacity ('+a.seats+'/'+a.cap+'). Do you authorize an enrollment override'+(r.late?' and late admission':'')+'?</div>';
    return '<div class="alert">Do you authorize late admission into '+a.code+'? The 100% refund deadline has passed.</div>'}
  if(st.role==='dean'){
    if(r.type==='swap')return '<div class="alert">Validate moving tuition from '+r.drop+' to '+r.add+' without a financial penalty or a W grade.</div>';
    return '<div class="alert">Approve a 100% refund override to drop '+r.drop+' after the deadline? If you deny, the student may choose a W with no refund.</div>'}
  if(r.type==='drop')return '<div class="alert">Lift the department hold for this section only so the student can drop '+r.drop+' with a 100% refund.</div>';
  return '<div class="alert">Review the override for '+a.code+': '+esc(blockers(a).join('; '))+'. Approval enrolls the student'+(r.type==='swap'?' first, then drops '+r.drop+' and moves the tuition':'')+'.</div>'}

function approverView(){
  const roleBtns=Object.keys(ROLES).map(k=>{const n=S.reqs.filter(r=>r.status==='pending'&&r.steps.find(s=>s.state==='active'&&s.role===k)).length;
    return '<button data-a="role" data-v="'+k+'" aria-pressed="'+(S.role===k)+'">'+ROLES[k]+' ('+n+')</button>'}).join('');
  const q=S.reqs.filter(r=>r.status==='pending'&&r.steps.find(s=>s.state==='active'&&s.role===S.role));
  const cards=q.map(r=>{const st=r.steps.find(s=>s.state==='active'),a=r.add?get(r.add):null,d=r.drop?get(r.drop):null;
    return '<article class="ap"><div class="req-top"><div><div class="req-title">'+esc(title(r))+'</div><div class="req-id">'+r.id+' · Sample Student, ID ending 1234 · '+r.date+'</div></div>'+chip(r.late?'After refund deadline':'Before refund deadline',r.late?'warn':'')+'</div>'
    +askText(r,st)
    +'<div class="sum">'+(a?'<div><span>Adding</span><b>'+a.code+' '+a.name+', section '+a.sec+' · '+a.inst+'</b></div>':'')+(d?'<div><span>Dropping</span><b>'+d.code+' '+d.name+', section '+d.sec+'</b></div>':'')
    +(r.note?'<div><span>Student note</span><b>'+esc(r.note)+'</b></div>':'')+'<div><span>Route</span><b>'+r.steps.map(s=>esc(s.role==='instructor'?'Instructor':ROLES[s.role])).join(' → ')+'</b></div></div>'
    +'<label class="f" for="n-'+r.id+'">Reason (shown to the student if you deny)</label><textarea id="n-'+r.id+'" placeholder="Optional for approvals, helpful for denials"></textarea>'
    +'<div class="ap-act"><button class="btn" data-a="dec" data-id="'+r.id+'" data-v="1">Approve</button><button class="btn danger" data-a="dec" data-id="'+r.id+'" data-v="0">Deny</button><button class="btn ghost" data-a="alt" data-id="'+r.id+'">Approver unavailable: reroute</button></div></article>'}).join('');
  return '<section class="panel"><div class="panel-h"><div><h2>Approver workspace</h2><p>You only see requests that are waiting on the role you are acting as.</p></div></div><div class="panel-b">'
   +'<p class="stepper" style="margin-bottom:8px">Acting as</p><div class="seg" role="group" aria-label="Acting as" style="margin-bottom:18px;width:fit-content;max-width:100%">'+roleBtns+'</div>'
   +(cards||'<div class="empty">Nothing is waiting for the '+ROLES[S.role]+'. Submit a request as the student to see it here.</div>')+'</div></section>'
   +'<p class="scope">Every decision is recorded in the request’s audit trail.</p>'}

/* ---------- wizard ---------- */
function openWiz(t,d){W={t,d:d||null,a:null,step:t==='drop'?2:1,note:''};drawWiz()}
function closeWiz(){W=null;$('#wiz').innerHTML=''}
function drawWiz(){
  if(!W)return;
  const T={add:'Add a class',drop:'Drop '+W.d,swap:'Swap '+W.d}[W.t];
  const total=W.t==='drop'?1:2,n=W.t==='drop'?1:W.step;
  let body='',foot='';
  if(W.step===1){
    const list=CAT.filter(c=>!S.courses.includes(c.code));
    body='<p>'+(W.t==='swap'?'Choose the class you want instead of <b>'+W.d+'</b>.':'Choose the class you want to add.')+'</p><div class="opts" role="radiogroup" aria-label="Classes">'
     +list.map(c=>'<label class="opt"><input type="radio" name="cls" value="'+c.code+'"'+(W.a===c.code?' checked':'')+'><div><b>'+c.code+' · '+c.name+'</b><div class="c-meta">Section '+c.sec+' · '+c.time+' · '+c.campus+' · '+c.inst+'</div>'
     +'<div class="chips">'+seatsChip(c)+(c.prereq?chip('Prerequisite missing','warn'):'')+(c.hold?chip('Department hold','warn'):'')+'</div></div></label>').join('')+'</div>';
    foot='<button class="btn ghost" data-a="wclose">Cancel</button><button class="btn" id="wnext" data-a="wnext"'+(W.a?'':' disabled')+'>Continue</button>';
  }else{
    const rt=route(W.t,W.d,W.a,isLate());
    const a=W.a?get(W.a):null,d=W.d?get(W.d):null;
    const needs=rt.steps.length>0;
    body='<div class="sum">'+(d&&W.t!=='add'?'<div><span>Dropping</span><b>'+d.code+' · '+d.name+'</b></div>':'')+(a?'<div><span>Adding</span><b>'+a.code+' · '+a.name+'</b></div>':'')+'<div><span>Date</span><b>'+dateLabel()+', 2026'+(isLate()?' (after refund deadline)':' (refund window open)')+'</b></div></div>'
     +'<div class="why '+(needs?'':'good')+'"><b>'+(needs?'Approval needed':'No approval needed')+'</b><span>'+esc(rt.why)+'</span></div>'
     +(needs?'<div><p class="stepper" style="margin-bottom:8px">Who reviews it</p><div class="route">'+rt.steps.map((s,i)=>(i?'<span class="arrow">→</span>':'')+'<span class="chip">'+esc(s.name)+'</span>').join('')+'</div>'
       +'<p class="c-meta" style="margin-top:8px">If a reviewer does not respond, the request is rerouted to an authorized alternate so it keeps moving.</p></div>'
       +(W.t==='swap'?'<p class="c-meta">Your current class stays untouched until every approval is in. If anyone says no, you keep '+W.d+'.</p>':''):'')
     +(needs?'<label class="f" for="wnote">Reason for your request (optional)</label><textarea id="wnote" placeholder="Tell the reviewer anything that helps">'+esc(W.note)+'</textarea>':'');
    const lbl=needs?'Submit for approval':({add:'Add class now',drop:'Drop class now',swap:'Swap now'})[W.t];
    foot=(W.t==='drop'?'<button class="btn ghost" data-a="wclose">Cancel</button>':'<button class="btn ghost" data-a="wback">Back</button>')+'<button class="btn" data-a="wsubmit" id="wgo">'+lbl+'</button>';
  }
  $('#wiz').innerHTML='<div class="scrim" data-a="wscrim"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="wt"><div class="m-h"><div><p class="stepper">Step '+n+' of '+total+'</p><h2 id="wt">'+esc(T)+'</h2></div><button class="x" data-a="wclose" aria-label="Close">×</button></div><div class="m-b">'+body+'</div><div class="m-f">'+foot+'</div></div></div>';
  const g=$('#wgo');if(g)g.focus();
}

function toast(t){const el=$('#toast');el.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';clearTimeout(toastT);toastT=setTimeout(()=>{el.innerHTML=''},3200)}

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.view)));
  document.querySelectorAll('#simseg button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.sim)));
  $('#app').innerHTML=S.view==='student'?studentView():approverView()}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el)return;
  const a=el.dataset.a;
  if(a==='wscrim'){if(e.target!==el)return;closeWiz();return}
  if(a==='view'){S.view=el.dataset.v}
  else if(a==='sim'){S.sim=el.dataset.v;toast(S.sim==='after'?'Simulating Oct 8: refund window closed':'Simulating Aug 31: refund window open')}
  else if(a==='reset'){fresh();toast('Demo reset')}
  else if(a==='role'){S.role=el.dataset.v}
  else if(a==='read'){S.notes.forEach(n=>n.n=false)}
  else if(a==='wiz'){openWiz(el.dataset.t,el.dataset.d);return}
  else if(a==='wclose'){closeWiz();return}
  else if(a==='wnext'){W.step=2;drawWiz();return}
  else if(a==='wback'){W.step=1;drawWiz();return}
  else if(a==='wsubmit'){
    const nt=$('#wnote');const note=nt?nt.value.trim():'';
    const r=submit(W.t,W.d,W.a,note);closeWiz();S.view='student';save();render();
    toast(r.status==='completed'?'Done. Your schedule is updated':'Sent to '+r.steps[0].name);window.scrollTo({top:0,behavior:'smooth'});return}
  else if(a==='dec'){const t=$('#n-'+el.dataset.id);decide(el.dataset.id,el.dataset.v==='1',t?t.value.trim():'');return}
  else if(a==='alt'){reassign(el.dataset.id);return}
  else if(a==='conf'){studentConfirm(el.dataset.id,el.dataset.v==='1');return}
  save();render()});
document.addEventListener('change',e=>{
  if(W&&e.target.name==='cls'){W.a=e.target.value;const b=$('#wnext');if(b)b.disabled=false}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&W)closeWiz()});


load();render();
})();
</script>
