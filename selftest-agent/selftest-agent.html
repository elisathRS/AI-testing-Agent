<title>Selftest Agent</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Oxanium:wght@500;600;700&display=swap">
<style>
/* Layout: dark HUD console. Sticky top bar; setup = two columns (settings | live mission preview); run = one centered readout; report = stacked HUD panels. */
:root{
  color-scheme:dark;
  --bg:#050911; --bg2:#0A1424; --panel:#0B1626; --panel2:#0F1D32; --line:#1A2D48; --line2:#2A4565;
  --fg:#DCE8F5; --muted:#8398B1; --cyan:#35D3F5; --cyan-d:#0E7C99; --violet:#8F7CFF;
  --ok:#34E0A1; --warn:#FFB84A; --bad:#FF5D73; --ink:#031018;
  --f-display:'Oxanium','Segoe UI',system-ui,sans-serif; --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif; --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.55;
  background-image:radial-gradient(900px 500px at 85% -10%,rgba(143,124,255,.16),transparent 60%),radial-gradient(800px 500px at 0% 0%,rgba(53,211,245,.12),transparent 55%),linear-gradient(rgba(53,211,245,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(53,211,245,.045) 1px,transparent 1px);
  background-size:auto,auto,44px 44px,44px 44px;background-attachment:fixed}
h1,h2,h3,p{margin:0}
h2{font-family:var(--f-display);font-weight:600;font-size:1.25rem;letter-spacing:.02em;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:600;font-size:1.05rem}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
[hidden]{display:none!important}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(5,9,17,.88);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar-in{max-width:1180px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.glyph{width:34px;height:34px;flex:none;display:grid;place-items:center;border:1.5px solid var(--cyan);transform:rotate(45deg);box-shadow:0 0 14px rgba(53,211,245,.45),inset 0 0 10px rgba(53,211,245,.25)}
.glyph i{width:10px;height:10px;background:var(--cyan);display:block;animation:pulse 2.4s ease-in-out infinite}
.brand b{display:block;font-family:var(--f-display);font-size:1.3rem;letter-spacing:.14em;text-transform:uppercase;line-height:1.1}
.brand span{display:block;font:500 .72rem var(--f-mono);letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.nav{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:transparent;border:1px solid var(--line2);color:var(--muted);padding:8px 16px;font:500 .78rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.nav button[aria-pressed="true"]{background:var(--cyan);color:var(--ink);border-color:var(--cyan)}
.nav button:disabled{opacity:.35;cursor:not-allowed}

main{max-width:1180px;margin:0 auto;padding:24px 16px 72px;display:grid;gap:20px}
.hud{position:relative;background:linear-gradient(180deg,rgba(17,31,52,.85),rgba(9,17,30,.92));border:1px solid var(--line);min-width:0}
.hud::before,.hud::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--cyan);pointer-events:none}
.hud::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
.hud::after{bottom:-1px;right:-1px;border-left:0;border-top:0}
.hud-h{padding:16px 20px 8px;display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.hud-b{padding:8px 20px 20px;display:grid;gap:16px}
.lbl{font:500 .72rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
.sub{color:var(--muted);font-size:.88rem}
.mono{font-family:var(--f-mono)}

.setup{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:minmax(0,1fr)}}
.col{display:grid;gap:20px;min-width:0}
.sticky{position:sticky;top:calc(84px + env(safe-area-inset-top,0px))}
@media (max-width:900px){.sticky{position:static}}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px 20px}
.fld{display:grid;gap:8px;align-content:start;min-width:0}
.fld>label,.fld>.lb{font:500 .74rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.fld>label output,.fld>.lb output{color:var(--cyan);font-weight:500}
.fld .hint{font-size:.8rem;color:var(--muted);line-height:1.4}
.wide{grid-column:1/-1}
select,input[type=text],input[type=number]{width:100%;min-height:44px;background:#07111F;border:1px solid var(--line2);padding:8px 12px;border-radius:0;font-size:.95rem;appearance:none;-webkit-appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--cyan) 50%),linear-gradient(135deg,var(--cyan) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
input[type=range]{width:100%;height:28px;background:transparent;appearance:none;-webkit-appearance:none;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;background:linear-gradient(90deg,var(--cyan) var(--p,0%),var(--line2) var(--p,0%))}
input[type=range]::-moz-range-track{height:4px;background:var(--line2)}
input[type=range]::-moz-range-progress{height:4px;background:var(--cyan)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6px;background:var(--bg);border:2px solid var(--cyan);transform:rotate(45deg);box-shadow:0 0 10px rgba(53,211,245,.7)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;background:var(--bg);border:2px solid var(--cyan);border-radius:0;box-shadow:0 0 10px rgba(53,211,245,.7)}
.seg{display:flex;border:1px solid var(--line2);flex-wrap:wrap}
.seg label{flex:1 1 0;min-width:72px;position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg span{display:block;text-align:center;padding:10px 8px;font:500 .78rem var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-right:1px solid var(--line2);min-height:44px;line-height:1.3;display:grid;place-items:center}
.seg label:last-child span{border-right:0}
.seg input:checked+span{background:rgba(53,211,245,.16);color:var(--cyan);box-shadow:inset 0 -2px 0 var(--cyan)}
.seg input:focus-visible+span{outline:2px solid var(--cyan);outline-offset:-2px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:.92rem}
.chk input{appearance:none;-webkit-appearance:none;width:20px;height:20px;flex:none;margin:2px 0 0;border:1.5px solid var(--cyan);background:#07111F;cursor:pointer;display:grid;place-items:center}
.chk input:checked{background:var(--cyan)}
.chk input:checked::after{content:"";width:9px;height:5px;border-left:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(-45deg) translate(1px,-1px)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.pchip{background:transparent;border:1px solid var(--line2);color:var(--fg);padding:8px 14px;font:500 .78rem var(--f-mono);letter-spacing:.08em;text-transform:uppercase;cursor:pointer;min-height:40px}
.pchip:hover{border-color:var(--cyan);color:var(--cyan)}
.packdesc{border-left:2px solid var(--cyan);padding:2px 0 2px 12px;font-size:.9rem;color:var(--muted)}
.tag{display:inline-block;font:500 .68rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--violet);color:var(--violet)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:10px 22px;border:1px solid var(--cyan);background:transparent;color:var(--cyan);font:600 .85rem var(--f-mono);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
.btn:hover{background:rgba(53,211,245,.12)}
.btn.go{background:var(--cyan);color:var(--ink);box-shadow:0 0 28px rgba(53,211,245,.5);width:100%;min-height:56px;font-size:.95rem}
.btn.go:hover{background:#6FE3FA}
.btn.sm{min-height:38px;padding:6px 16px;font-size:.74rem}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad:hover{background:rgba(255,93,115,.12)}

.big{font-family:var(--f-display);font-weight:700;line-height:1;font-variant-numeric:tabular-nums;color:var(--fg)}
.pv{display:grid;gap:14px}
.pv-n{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.pv-n .big{font-size:3.6rem;color:var(--cyan);text-shadow:0 0 22px rgba(53,211,245,.5)}
.mix{display:flex;height:10px;gap:2px}
.mix i{display:block;height:100%}
.legend{display:grid;gap:6px;font:400 .8rem var(--f-mono);color:var(--muted)}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;display:inline-block;flex:none}
.legend b{margin-left:auto;color:var(--fg);font-weight:500}
.kv{display:grid;gap:6px;font:400 .82rem var(--f-mono)}
.kv div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:4px}
.kv span{color:var(--muted)}
.kv b{font-weight:500;text-align:right}

/* boot + run */
.boot{display:grid;gap:10px;font:400 .9rem var(--f-mono);min-height:210px;align-content:center}
.boot div{opacity:0;transform:translateX(-8px);animation:in .3s forwards}
.boot b{color:var(--cyan);font-weight:500}
.run{display:grid;gap:22px}
.run-top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.state{display:inline-flex;align-items:center;gap:8px;font:500 .74rem var(--f-mono);letter-spacing:.16em;text-transform:uppercase}
.state::before{content:"";width:9px;height:9px;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.2s ease-in-out infinite}
.state.paused::before{background:var(--warn);box-shadow:0 0 10px var(--warn);animation:none}
.readout{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
.readout .big{font-size:clamp(3.2rem,12vw,6rem)}
.readout .of{font:500 clamp(1.4rem,5vw,2.2rem) var(--f-display);color:var(--muted);padding-bottom:.35em}
.readout .pct{margin-left:auto;font:700 clamp(1.6rem,6vw,2.6rem) var(--f-display);color:var(--cyan);text-shadow:0 0 18px rgba(53,211,245,.5);font-variant-numeric:tabular-nums}
.lb{position:relative;height:26px;background:#060E1A;border:1px solid var(--line2);overflow:hidden}
.lb i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--cyan-d),var(--cyan) 65%,var(--violet));box-shadow:0 0 24px rgba(53,211,245,.7);transition:width .25s ease-out}
.lb i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);transform:translateX(-100%);animation:sweep 1.5s linear infinite}
.lb::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 2px),rgba(5,9,17,.95) calc(10% - 2px),rgba(5,9,17,.95) 10%);pointer-events:none}
.scale{display:flex;justify-content:space-between;font:400 .7rem var(--f-mono);color:var(--muted);margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{border:1px solid var(--line2);padding:10px 14px;display:grid;gap:2px}
.stat b{font:700 1.9rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat.ok b{color:var(--ok)}.stat.warn b{color:var(--warn)}.stat.bad b{color:var(--bad)}
.run-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
@media (max-width:860px){.run-grid{grid-template-columns:minmax(0,1fr)}}
.mx{display:grid;grid-template-columns:repeat(auto-fill,minmax(15px,1fr));gap:3px}
.mx span{aspect-ratio:1;background:#0D1A2D;border:1px solid #14263F}
.mx .p{background:var(--ok);border-color:var(--ok);box-shadow:0 0 6px rgba(52,224,161,.5)}
.mx .f{background:var(--warn);border-color:var(--warn);box-shadow:0 0 6px rgba(255,184,74,.5)}
.mx .x{background:var(--bad);border-color:var(--bad);box-shadow:0 0 6px rgba(255,93,115,.6)}
.mx .c{border-color:var(--cyan);background:rgba(53,211,245,.35);animation:pulse .7s ease-in-out infinite}
.feed{list-style:none;margin:0;padding:0;display:grid;gap:5px;font:400 .8rem var(--f-mono);color:var(--muted)}
.feed li{display:flex;gap:10px;align-items:baseline;border-left:2px solid var(--line2);padding-left:10px}
.feed li.f{border-color:var(--warn);color:var(--warn)}.feed li.x{border-color:var(--bad);color:var(--bad)}.feed li.p{border-color:var(--ok)}
.feed b{color:var(--fg);font-weight:500;flex:none}
.feed span{min-width:0;overflow-wrap:anywhere}
.ctl{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* report */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.tile{border:1px solid var(--line2);padding:12px 14px}
.tile b{display:block;font:700 2.1rem var(--f-display);line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font:500 .7rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.tile.ok b{color:var(--ok)}.tile.warn b{color:var(--warn)}.tile.bad b{color:var(--bad)}.tile.cy b{color:var(--cyan)}
.issues{display:grid;gap:14px}
.issue{border:1px solid var(--line2);border-left:4px solid var(--line2);padding:14px 16px;display:grid;gap:8px;font-size:.92rem;background:rgba(6,14,26,.6)}
.issue.Critical{border-left-color:var(--bad)}.issue.High{border-left-color:var(--warn)}.issue.Medium{border-left-color:var(--cyan)}.issue.Low{border-left-color:var(--muted)}
.issue-top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:flex-start}
.pill{display:inline-block;font:500 .68rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border:1px solid var(--line2);color:var(--muted)}
.pill.Critical{border-color:var(--bad);color:var(--bad)}.pill.High{border-color:var(--warn);color:var(--warn)}.pill.Medium{border-color:var(--cyan);color:var(--cyan)}
.pill.ok{border-color:var(--ok);color:var(--ok)}.pill.bad{border-color:var(--bad);color:var(--bad)}.pill.warn{border-color:var(--warn);color:var(--warn)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tw{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:.85rem;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:500 .7rem var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:rgba(53,211,245,.06);white-space:nowrap}
td.n{text-align:right}
details summary{cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details ul{margin:8px 0 0;padding-left:18px;color:var(--muted)}
details li.x{color:var(--bad)}
.ai{display:grid;gap:12px;font-size:.92rem}
.ai ol,.ai ul{margin:0;padding-left:20px;display:grid;gap:6px}
#md{width:100%;min-height:150px;background:#07111F;border:1px solid var(--line2);font:12px/1.4 var(--f-mono);padding:10px}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--panel2);border:1px solid var(--cyan);padding:12px 20px;font:500 .84rem var(--f-mono);z-index:60;max-width:calc(100% - 32px);box-shadow:0 0 24px rgba(53,211,245,.35)}
.foot{font:400 .76rem var(--f-mono);color:var(--muted);text-align:center;padding-top:6px}

@keyframes sweep{to{transform:translateX(100%)}}
@keyframes pulse{50%{opacity:.35}}
@keyframes in{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.lb i::after,.glyph i,.state::before,.mx .c{animation:none}.boot div{animation-duration:.01s}}
</style>
<header class="bar"><div class="bar-in"><div class="brand"><span class="glyph" aria-hidden="true"><i></i></span><div><b>Selftest Agent</b><span>MDC Class Changes · autonomous test bench</span></div></div>

<script>
(function(){
/* ===== Selftest Agent core: headless copy of the Class Changes rules (no DOM) ===== */
const DEADLINE='Sep 4, 2026';
const ROLES={chair:'Department Chair / Assistant',instructor:'Instructor',dean:'Dean of Students'};
const CUR0=[
 {code:'ENC 1101',name:'Freshman Composition I',sec:'1431',inst:'Prof. Alvarez',cr:3,days:'MW',s:540,e:615},
 {code:'MAC 1105',name:'College Algebra',sec:'2210',inst:'Prof. Okafor',cr:3,days:'TR',s:660,e:735},
 {code:'SPC 1017',name:'Fundamentals of Speech',sec:'3302',inst:'Prof. Delgado',cr:3,days:'F',s:600,e:765,hold:'Department hold (Communication)'},
 {code:'HUM 2020',name:'Humanities Survey',sec:'4125',inst:'Prof. Nguyen',cr:3,days:'',s:0,e:0}];
const CAT0=[
 {code:'BSC 1010',name:'Biology I',sec:'5120',inst:'Prof. Reyes',cr:3,seats:30,cap:30,days:'MW',s:780,e:855},
 {code:'MAC 2311',name:'Calculus I',sec:'5231',inst:'Prof. Chen',cr:3,seats:24,cap:35,days:'TR',s:570,e:645,prereq:'MAC 1147 is not on your record'},
 {code:'CHM 1045',name:'General Chemistry I',sec:'5522',inst:'Prof. Silva',cr:3,seats:18,cap:30,days:'MW',s:900,e:975,hold:'Department hold (Natural Sciences)'},
 {code:'PSY 2012',name:'General Psychology',sec:'5344',inst:'Prof. Haddad',cr:3,seats:27,cap:35,days:'MW',s:660,e:735},
 {code:'STA 2023',name:'Statistics I',sec:'5410',inst:'Prof. Barros',cr:3,seats:31,cap:40,days:'TR',s:780,e:855}];
const EXTRA0=[
 {code:'MUS 1010',name:'Music Appreciation',sec:'5601',inst:'Prof. Lang',cr:3,seats:20,cap:30,days:'MW',s:570,e:645},
 {code:'ECO 2013',name:'Principles of Macroeconomics',sec:'5702',inst:'Prof. Price',cr:3,seats:25,cap:35,days:'TR',s:630,e:705}];
const specBlock=c=>!!c&&((c.cap&&c.seats>=c.cap)||!!c.prereq||!!c.hold);

const RULE_LABELS={dupGuard:'Block duplicate requests',lockReview:'Lock a class while a request is in review',refundRecheck:'Re-check the refund deadline at approval',
 swapHold:'Check holds when swapping out',lateBlockers:'Check holds and prerequisites after the deadline',seats:'Update seat counts',creditCap:'Credit limit',
 loadWarn:'Warn on very low credit load',requireReason:'Require a reason to deny',escalate:'Escalate after repeated reroutes',instructorScope:'Show instructors only their classes',
 dateStamp:'Stamp real dates in the audit trail',cancel:'Let students cancel a request',emptyHint:'Explain an empty class list',answerBy:'Give a date to answer the W choice',
 officeAlt:'Route to an alternate when an office is closed',rollback:'Roll back a failed swap',timeConflict:'Check time conflicts'};
const PROPOSED={};Object.keys(RULE_LABELS).forEach(k=>PROPOSED[k]=true);
const RULESETS={current:{},proposed:PROPOSED};

function makeEngine(rules,env){
  rules=rules||{};env=env||{};
  const cur=CUR0.map(c=>({...c})),cat=CAT0.concat(EXTRA0).map(c=>({...c}));
  const all=cur.concat(cat),get=c=>all.find(x=>x.code===c);
  const S={sim:env.late?'after':'before',courses:cur.map(c=>c.code),reqs:[],notes:[],seq:1042};
  const E={rules,env,S,get,cat,cur};
  const isLate=()=>S.sim==='after',dateLabel=()=>S.sim==='before'?'Aug 31':'Oct 8';
  E.isLate=isLate;E.setSim=v=>{S.sim=v};
  const blockers=c=>{const b=[];if(!c)return b;
    if(c.cap&&c.seats>=c.cap)b.push('Class is full ('+c.seats+'/'+c.cap+')');
    if(c.prereq)b.push('Prerequisite missing: '+c.prereq);
    if(c.hold)b.push(c.hold);return b};
  E.blockers=blockers;
  const credits=()=>S.courses.reduce((a,c)=>a+get(c).cr,0);E.credits=credits;
  const conflicts=(code,exceptDrop)=>{const a=get(code);if(!a||!a.days)return[];
    return S.courses.filter(x=>x!==exceptDrop&&x!==code).map(get).filter(b=>b.days&&b.days.split('').some(d=>a.days.includes(d))&&a.s<b.e&&b.s<a.e).map(b=>b.code)};
  E.conflicts=conflicts;
  const step=(role,course)=>({role,name:role==='instructor'?'Instructor, '+get(course).inst:ROLES[role],state:'waiting'});
  const log=(r,t)=>r.audit.push((rules.dateStamp?dateLabel():r.date)+': '+t);
  const notify=t=>S.notes.unshift({t,d:dateLabel(),n:true});
  const title=r=>r.type==='add'?'Add '+r.add:r.type==='drop'?'Drop '+r.drop:'Swap '+r.drop+' for '+r.add;
  function route(type,drop,add){
    const late=isLate(),a=add?get(add):null,d=drop?get(drop):null,bl=blockers(a),conf=(a&&type!=='drop')?conflicts(add,drop):[];
    let o;
    if(type==='add')o=late?{sc:'A3',steps:[step('instructor',add)]}:bl.length?{sc:'A1',steps:[step('chair')]}:{sc:'direct',steps:[]};
    else if(type==='drop')o=late?{sc:'D3',steps:[step('dean')]}:d.hold?{sc:'D1',steps:[step('chair')]}:{sc:'direct',steps:[]};
    else o=late?{sc:'S3',steps:[step('instructor',add),step('dean')]}:bl.length?{sc:'S1',steps:[step('chair')]}:{sc:'direct',steps:[]};
    if(rules.swapHold&&type==='swap'&&!late&&d.hold&&!o.steps.length){o.steps=[step('chair')]}
    if(rules.lateBlockers&&late&&type!=='drop'&&bl.length&&!o.steps.some(s=>s.role==='chair')){const i=o.steps.findIndex(s=>s.role==='instructor');o.steps.splice(i+1,0,step('chair'))}
    if(rules.timeConflict&&conf.length&&!o.steps.some(s=>s.role==='chair'))o.steps.unshift(step('chair'));
    return o}
  function enroll(c){if(!S.courses.includes(c)){S.courses.push(c);if(rules.seats){const x=get(c);if(x.cap)x.seats++}}}
  function unenroll(c){if(S.courses.includes(c)){S.courses=S.courses.filter(x=>x!==c);if(rules.seats){const x=get(c);if(x.cap)x.seats--}}}
  function finish(r){
    r.staleDrop=r.type!=='add'&&!S.courses.includes(r.drop);
    if(rules.lockReview&&r.staleDrop){r.status='cancelled';r.outcome='Cancelled: '+r.drop+' is no longer on the schedule.';log(r,'Cancelled automatically');notify(r.outcome);return}
    if(r.type==='add'){enroll(r.add);log(r,'Enrollment added in the SIS (simulated)');r.outcome='You are enrolled in '+r.add+'.'}
    else if(r.type==='drop'){unenroll(r.drop);log(r,'Class dropped in the SIS (simulated)');r.outcome=r.sc==='D3'?'Dropped '+r.drop+' with a 100% refund override.':'Dropped '+r.drop+' with a 100% refund.'}
    else{enroll(r.add);log(r,'Step 1: '+r.add+' added');
      if(env.sisFail==='drop'){
        if(rules.rollback){unenroll(r.add);r.status='failed';r.outcome='The swap could not finish. No changes were made.';log(r,'Step 2 failed. Step 1 rolled back');notify(r.outcome);return}
        r.status='stuck';log(r,'Step 2 failed');return}
      unenroll(r.drop);log(r,'Step 2: '+r.drop+' dropped');log(r,'Tuition balance transferred to '+r.add);
      r.outcome='Swap complete. You are in '+r.add+' and '+r.drop+' was dropped.'}
    r.status='completed';notify(title(r)+': '+r.outcome)}
  E.credit_after=(type,drop,add)=>credits()+(type!=='drop'?get(add).cr:0)-(type!=='add'?get(drop).cr:0);
  E.submit=function(type,drop,add,note){
    const open=S.reqs.filter(r=>r.status==='pending'||r.status==='needs');
    if(rules.dupGuard&&(open.some(r=>r.type===type&&r.add===add&&r.drop===drop)||(add&&open.some(r=>r.add===add))))return{rejected:'You already have a request for this class in review'};
    if(rules.lockReview&&drop&&open.some(r=>r.drop===drop||r.add===drop))return{rejected:drop+' already has a request in review'};
    if(rules.creditCap&&E.credit_after(type,drop,add)>18)return{rejected:'This change goes over the 18-credit limit'};
    const rt=route(type,drop,add);
    const r={id:'REQ-'+(S.seq++),type,drop,add,late:isLate(),sc:rt.sc,date:dateLabel(),note:note||'',steps:rt.steps,status:'pending',audit:[],outcome:'',warnings:[]};
    if(rules.loadWarn&&E.credit_after(type,drop,add)<6)r.warnings.push('This puts you under 6 credits. Talk to Financial Aid and an advisor first.');
    log(r,'Submitted by student');
    if(!r.steps.length){log(r,'No approval needed');finish(r)}
    else{r.steps[0].state='active';log(r,'Routed to '+r.steps[0].name);
      if(rules.officeAlt&&env.officeClosed){r.steps[0].alt=true;r.eta='Office closed. Sent to an authorized alternate. Expect an answer by the next business day.';log(r,'Office closed. Routed to an alternate')}
      notify(title(r)+' sent to '+r.steps[0].name+' for review.')}
    S.reqs.unshift(r);return{req:r}};
  function alts(except){return cat.filter(c=>c.code!==except&&!S.courses.includes(c.code)&&!blockers(c).length).slice(0,3)}
  function deny(r,reason){
    if(r.sc==='D3'){r.status='needs';if(rules.answerBy)r.answerBy='Sep 18 (14 days)';notify('The Dean did not approve a refund for '+r.drop+'.');return}
    r.status='denied';
    if(r.type==='drop')r.outcome='Not approved. You remain enrolled in '+r.drop+'.'+(reason?' Reason: '+reason:'');
    else r.outcome=(r.type==='swap'?'Swap not approved. You stay in '+r.drop+'.':'Add not approved.')+(reason?' Reason: '+reason:'')+(alts(r.add).length?' Other open sections are listed.':'');
    notify(title(r)+' was not approved.')}
  E.decide=function(id,ok,reason){
    const r=S.reqs.find(x=>x.id===id);if(!r)return{error:'not found'};
    const st=r.steps.find(s=>s.state==='active');if(!st)return{error:'no active step'};
    if(!ok&&!reason&&rules.requireReason)return{error:'reason required'};
    st.note=reason;log(r,st.name+(ok?' approved':' denied')+(reason?' ('+reason+')':''));
    if(ok){st.state='approved';
      if(rules.refundRecheck&&isLate()&&!r.late&&r.type!=='add'&&!r.steps.some(s=>s.role==='dean')){r.steps.push(step('dean'));log(r,'The deadline passed during review. Dean of Students review added')}
      const nx=r.steps.find(s=>s.state==='waiting');
      if(nx){nx.state='active';log(r,'Routed to '+nx.name);notify(title(r)+' approved by '+st.name+'. Now with '+nx.name+'.')}
      else finish(r)}
    else{st.state='denied';r.steps.forEach(s=>{if(s.state==='waiting')s.state='skipped'});deny(r,reason)}
    return{ok:true}};
  E.reassign=function(id){
    const r=S.reqs.find(x=>x.id===id),st=r&&r.steps.find(s=>s.state==='active');if(!st)return{error:'no active step'};
    st.alt=true;st.reroutes=(st.reroutes||0)+1;log(r,'Approver unavailable. Rerouted to an alternate for '+st.name);notify(title(r)+' moved to an alternate.');
    if(rules.escalate&&st.reroutes>=2&&st.role==='chair'){st.role='dean';st.name=ROLES.dean+' (escalated)';st.escalated=true;log(r,'No response. Escalated to the Dean of Students')}
    return{ok:true}};
  E.confirm=function(id,yes){const r=S.reqs.find(x=>x.id===id);
    if(yes){unenroll(r.drop);r.status='completed';r.outcome='Dropped '+r.drop+' as a W with no refund.';log(r,'Student confirmed withdrawal with a W')}
    else{r.status='cancelled';r.outcome='Request cancelled. You remain enrolled in '+r.drop+'.';log(r,'Student cancelled the request')}
    notify(r.outcome);return{ok:true}};
  E.canCancel=()=>!!rules.cancel;
  E.cancel=function(id){if(!rules.cancel)return{error:'not offered'};const r=S.reqs.find(x=>x.id===id);if(!r||r.status!=='pending')return{error:'not pending'};
    r.status='cancelled';r.steps.forEach(s=>{if(s.state==='active'||s.state==='waiting')s.state='skipped'});log(r,'Student cancelled the request');notify(title(r)+' was cancelled.');return{ok:true}};
  E.queue=(role,who)=>S.reqs.filter(r=>r.status==='pending'&&r.steps.some(s=>s.state==='active'&&s.role===role&&(!(rules.instructorScope&&role==='instructor'&&who)||(r.add&&get(r.add).inst===who))));
  E.addOptions=()=>{const list=cat.filter(c=>!S.courses.includes(c.code));return{list,hint:list.length||!rules.emptyHint?null:'No other classes are open this term. Ask an advisor about a waitlist.'}};
  E.approveAll=(r,reason)=>{let n=0;while(r.status==='pending'&&r.steps.some(s=>s.state==='active')&&n++<8){const o=E.decide(r.id,true,reason||'');if(o.error)break}return r};
  return E}

/* ---- documented routes (independent of the engine) ---- */
function specFor(type,drop,add,late){
  const a=add&&CAT0.concat(EXTRA0).find(c=>c.code===add),d=drop&&CUR0.find(c=>c.code===drop);
  if(type==='add')return late?{sc:'A3',roles:['instructor']}:specBlock(a)?{sc:'A1',roles:['chair']}:{sc:'direct',roles:[]};
  if(type==='drop')return late?{sc:'D3',roles:['dean']}:d.hold?{sc:'D1',roles:['chair']}:{sc:'direct',roles:[]};
  return late?{sc:'S3',roles:['instructor','dean']}:specBlock(a)?{sc:'S1',roles:['chair']}:{sc:'direct',roles:[]}}
const applyChange=(c,t)=>{c=c.slice();if(t.type!=='drop'&&!c.includes(t.add))c.push(t.add);if(t.type!=='add')c=c.filter(x=>x!==t.drop);return c};
const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
const shortRole=r=>r==='instructor'?'Instructor':r==='dean'?'Dean':'Chair';

function runFlow(t,rules,chk,find,res){
  const E=makeEngine(rules,{late:t.late,officeClosed:t.closed,sisFail:t.fail});
  const start=E.S.courses.slice(),failing=!!t.fail&&t.type==='swap';
  const confl=t.add&&t.type!=='drop'?E.conflicts(t.add,t.drop):[],seatBefore=t.add?E.get(t.add).seats:0;
  const sub=E.submit(t.type,t.drop,t.add,t.note);
  if(sub.rejected){res.blocked=sub.rejected;res.final='blocked';chk(true,'Blocked by a rule: '+sub.rejected);return}
  const r=sub.req;res.req=r.id;
  chk(r.sc===t.sp.sc,'Routed as '+t.sp.sc+(r.sc!==t.sp.sc?' (engine used '+r.sc+')':''));
  const roles=r.steps.map(s=>s.role);let k=0;roles.forEach(x=>{if(k<t.sp.roles.length&&x===t.sp.roles[k])k++});
  chk(k===t.sp.roles.length,'Approval chain includes '+(t.sp.roles.map(shortRole).join(' → ')||'no approvers'));
  let i=0,denied=false,deniedBlank=false,made=0,rer=0;
  while(r.status==='pending'&&i<8){
    const st=r.steps.find(s=>s.state==='active');if(!st)break;
    const ok=i<t.dec.length?t.dec[i]:true,rr=t.reroute[i]||0;
    for(let q=0;q<rr;q++){E.reassign(r.id);rer++}
    let reason=t.reasons[i]||'',o=E.decide(r.id,ok,reason);
    if(o.error==='reason required'){chk(true,'A blank denial reason was refused');o=E.decide(r.id,ok,'Please contact the department.')}
    else if(!ok&&!reason&&!o.error)deniedBlank=true;
    if(o.error){chk(false,'Decision failed: '+o.error);break}
    made++;if(!ok){denied=true;break}i++}
  let noDate=false;
  if(r.status==='needs'){chk(r.sc==='D3','Student is asked to choose W or keep the class');noDate=!r.answerBy;E.confirm(r.id,t.w)}
  res.final=r.status;
  let exp=null;
  if(denied)exp=r.sc==='D3'?(t.w?'completed':'cancelled'):'denied';else if(!failing)exp='completed';
  if(exp){chk(r.status===exp,'Final status is '+exp+(r.status!==exp?' (got '+r.status+')':''));
    const ec=exp==='completed'?applyChange(start,t):start;
    chk(sameSet(E.S.courses,ec),'Schedule matches the expected '+ec.length+' classes')}
  chk(r.audit.length>=1+made+rer,'Audit trail has an entry for each step ('+r.audit.length+')');
  if(!failing)chk(E.S.notes.length>=1,'Student received an update');
  chk(new Set(E.S.courses).size===E.S.courses.length,'No class appears twice on the schedule');
  const hasChair=r.steps.some(s=>s.role==='chair');
  if(r.status==='completed'&&t.add){const a=E.get(t.add);if(a.cap&&a.seats===seatBefore)find('F6','Enrolled in '+t.add+', but the section still shows '+a.seats+'/'+a.cap+' seats taken.')}
  if(deniedBlank&&!rules.requireReason)find('F9',r.id+' was denied with no reason. The student only sees "'+r.outcome.split('.')[0]+'."');
  if(t.type==='swap'&&!t.late&&E.get(t.drop).hold&&!hasChair)find('F4','Swapped out of '+t.drop+' ('+E.get(t.drop).hold+') with no Chair approval.');
  if(t.late&&t.add){const a=E.get(t.add);if((a.prereq||a.hold)&&!hasChair&&r.status==='completed')find('F5',t.add+' has '+(a.prereq?'a missing prerequisite':'a department hold')+', but after the deadline it only went to '+r.steps.map(s=>shortRole(s.role)).join(' → ')+'.')}
  if(t.closed&&r.steps.length&&!r.eta)find('F16',r.id+' reached '+(r.steps[0].name)+' while the office was closed. The student was given no alternate and no expected response time.');
  if(confl.length&&!hasChair&&r.status==='completed')find('F18',t.add+' was added although it overlaps '+confl.join(', ')+'.');
  if(noDate)find('F15','The W-or-keep choice for '+r.id+' shows no date to answer by.');
  if(failing&&(r.status==='stuck'||(E.S.courses.includes(t.add)&&E.S.courses.includes(t.drop))))find('F17','When step 2 of '+r.id+' failed, the student stayed enrolled in both '+t.drop+' and '+t.add+' with the request stuck.');
  if(r.status==='completed'&&r.staleDrop)find('F2',r.id+' completed for '+r.drop+', which was no longer on the schedule.');
  if(E.credits()<=3&&!r.warnings.length&&r.type!=='add'&&r.status==='completed')find('F8','The schedule fell to '+E.credits()+' credits with no warning.')}

function runBurst(t,rules,chk,find,res){
  const E=makeEngine(rules,{late:t.late,officeClosed:t.closed,sisFail:t.fail});
  const subs=[];let rej=0,dup=0;
  t.reqs.forEach(q=>{const open=E.S.reqs.filter(r=>r.status==='pending'&&r.type===q.type&&r.add===q.add&&r.drop===q.drop).length;
    const s=E.submit(q.type,q.drop,q.add,'');if(s.rejected)rej++;else{subs.push(s.req);if(open)dup++}});
  res.final=subs.length+' accepted, '+rej+' blocked';
  chk(true,subs.length+' request(s) accepted, '+rej+' blocked by a rule');
  if(dup)find('F1',dup+' duplicate request(s) for the same change were accepted in one burst.');
  let j=0,stale=0;
  t.order.forEach((idx,n)=>{const r=subs[idx%Math.max(1,subs.length)];if(!r)return;
    let g=0;while(r.status==='pending'&&r.steps.some(s=>s.state==='active')&&g++<6){
      const ok=t.dec[(j++)%t.dec.length];let o=E.decide(r.id,ok,ok?'':'Reviewed');if(o.error)break;if(!ok)break}});
  subs.forEach(r=>{if(r.status==='needs')E.confirm(r.id,t.w);if(r.status==='completed'&&r.staleDrop){stale++;find('F2',r.id+' ('+(r.type==='swap'?'swap':'drop')+' of '+r.drop+') completed after '+r.drop+' was already gone from the schedule.')}});
  chk(new Set(E.S.courses).size===E.S.courses.length,'No class appears twice on the schedule');
  chk(E.S.courses.every(c=>!!E.get(c)),'Every enrolled class exists');
  chk(subs.every(r=>r.status!=='pending'||r.steps.some(s=>s.state==='active')),'No request is left without an active approver');
  chk(E.credits()===E.S.courses.reduce((a,c)=>a+E.get(c).cr,0),'Credit total matches the schedule ('+E.credits()+')');
}

function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
const REASONS=['No seats can be added to this section.','Prerequisite must be completed first.','Request came in after the cutoff for this exception.','Please meet with an advisor first.'];
const NOTES=['I need this for my program plan.','My work schedule changed this term.','My advisor recommended this change.','This class conflicts with my new job hours.'];

function buildPlan(cfg){
  const R=rng(cfg.seed),pick=a=>a[Math.floor(R()*a.length)];
  const pack=PACKS[cfg.pack],pool=CAT0.concat(cfg.extra?EXTRA0:[]);
  const blockedP=pool.filter(specBlock).map(c=>c.code),openP=pool.filter(c=>!specBlock(c)).map(c=>c.code);
  const allCur=CUR0.map(c=>c.code),noHold=CUR0.filter(c=>!c.hold).map(c=>c.code);
  const pA={mostly:.8,balanced:.65,rarely:.3,always:1,never:0}[cfg.approve],pB={sometimes:.4,never:0,always:1}[cfg.blank];
  const types=['add','drop','swap'].filter(t=>cfg.types[t]);if(!types.length)types.push('add');
  const lateOK=cfg.late>0,earlyOK=cfg.late<100;
  const mk=(type,drop,add,late,dec,w,tag)=>{
    const sp=specFor(type,drop,add,late);
    dec=sp.roles.map((_,i)=>dec&&dec[i]!==undefined?dec[i]:R()<pA);
    const reasons=dec.map(ok=>ok?'':(R()<pB?'':pick(REASONS)));
    const reroute=sp.roles.map(()=>R()<cfg.unavail/100?1:0);
    const w2=w!==undefined?w:R()<.5,closed=R()<cfg.closed/100,fail=type==='swap'&&R()<cfg.fail/100?'drop':'';
    const lbl=type==='add'?'Add '+add:type==='drop'?'Drop '+drop:'Swap '+drop+' for '+add;
    let desc=sp.roles.map((r,i)=>shortRole(r)+(reroute[i]?' (rerouted)':'')+': '+(dec[i]?'approve':'deny'+(reasons[i]?'':', no reason'))).slice(0,(dec.indexOf(false)+1)||dec.length).join(', ')||'No approval needed';
    if(sp.sc==='D3'&&dec[0]===false)desc+=', student: '+(w2?'W':'keep');
    if(closed)desc+=' · office closed';if(fail)desc+=' · system failure';
    return{kind:'flow',type,drop,add,late,sp,dec,reasons,reroute,w:w2,closed,fail,note:sp.roles.length&&R()<.5?pick(NOTES):'',sc:sp.sc,title:lbl+' · '+(late?'after':'before')+' deadline',desc,tag:tag||'random'}};
  const ok=(type,late)=>types.includes(type)&&(late?lateOK:earlyOK);
  const plan=[];
  if(pack.anchors){
    const A=[['add',null,()=>pick(blockedP),false,[true]],['add',null,()=>pick(blockedP),false,[false]],['add',null,()=>pick(pool.map(c=>c.code)),true,[true]],['add',null,()=>pick(pool.map(c=>c.code)),true,[false]],
     ['drop','SPC 1017',null,false,[true]],['drop','SPC 1017',null,false,[false]],['drop',()=>pick(allCur),null,true,[true]],['drop',()=>pick(allCur),null,true,[false],true],['drop',()=>pick(allCur),null,true,[false],false],
     ['swap',()=>pick(noHold),()=>pick(blockedP),false,[true]],['swap',()=>pick(noHold),()=>pick(blockedP),false,[false]],['swap',()=>pick(allCur),()=>pick(pool.map(c=>c.code)),true,[true,true]],['swap',()=>pick(allCur),()=>pick(pool.map(c=>c.code)),true,[true,false]],['swap',()=>pick(allCur),()=>pick(pool.map(c=>c.code)),true,[false]],
     ['add',null,()=>pick(openP),false],['drop',()=>pick(noHold),null,false],['swap',()=>pick(noHold),()=>pick(openP),false]];
    A.forEach(a=>{if(!ok(a[0],a[3]))return;const f=v=>typeof v==='function'?v():v;plan.push(mk(a[0],f(a[1]),f(a[2]),a[3],a[4],a[5],'route'))})}
  pack.probes.forEach(id=>plan.push({kind:'probe',pid:id,sc:'Edge',title:PROBES[id].title,desc:'Edge-case probe',tag:'probe'}));
  const randFlow=()=>{const type=pick(types),late=lateOK&&(!earlyOK||R()<cfg.late/100);
    return mk(type,type==='add'?null:pick(allCur),type==='drop'?null:pick(R()<.5?blockedP:openP.length?openP:blockedP),late)};
  const burst=()=>{const k=2+Math.floor(R()*2),reqs=[];
    for(let i=0;i<k;i++){const type=pick(types);reqs.push({type,drop:type==='add'?null:pick(['ENC 1101','SPC 1017','HUM 2020']),add:type==='drop'?null:pick(['BSC 1010','PSY 2012','MAC 2311'])})}
    const late=lateOK&&(!earlyOK||R()<cfg.late/100);
    return{kind:'burst',late,reqs,order:reqs.map(()=>Math.floor(R()*9)),dec:[R()<pA,R()<pA,R()<pA],w:R()<.5,closed:R()<cfg.closed/100,fail:R()<cfg.fail/100?'drop':'',sc:'Burst',
      title:k+' overlapping requests · '+(late?'after':'before')+' deadline',desc:reqs.map(q=>q.type==='add'?'add '+q.add:q.type==='drop'?'drop '+q.drop:'swap '+q.drop+'→'+q.add).join(', '),tag:'burst'}};
  while(plan.length<cfg.count)plan.push(R()<cfg.burst/100?burst():randFlow());
  for(let i=plan.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[plan[i],plan[j]]=[plan[j],plan[i]]}
  plan.forEach((p,i)=>p.id='T'+String(i+1).padStart(3,'0'));
  return plan}

function runCase(t,rules){
  const res={id:t.id,title:t.title,kind:t.kind,tag:t.tag,sc:t.sc,desc:t.desc,status:'pass',checks:[],findings:[],ev:{},final:''};
  const chk=(ok,msg)=>{res.checks.push({ok:!!ok,msg});if(!ok)res.status='fail'};
  const find=(k,ev)=>{if(!res.findings.includes(k))res.findings.push(k);if(!res.ev[k])res.ev[k]=ev};
  try{
    if(t.kind==='flow')runFlow(t,rules,chk,find,res);
    else if(t.kind==='burst')runBurst(t,rules,chk,find,res);
    else{const x={chk,find,mk:(env,off)=>makeEngine(off?Object.assign({},rules,off):rules,env||{})};
      PROBES[t.pid].run(x)}
  }catch(e){res.status='fail';res.checks.push({ok:false,msg:'Error: '+((e&&e.message)||e)})}
  if(res.status==='pass'&&res.findings.length)res.status='finding';
  return res}

const COVORD=['A1','A3','D1','D3','S1','S3','direct'];
function summarize(results){
  const agg={};
  results.forEach(r=>r.findings.forEach(k=>{const a=agg[k]=agg[k]||{key:k,count:0,ids:[],ev:[]};a.count++;a.ids.push(r.id);if(a.ev.length<2&&!a.ev.includes(r.ev[k]))a.ev.push(r.ev[k])}));
  const findings=Object.values(agg).sort((a,b)=>SEVR[FX[a.key].sev]-SEVR[FX[b.key].sev]||b.count-a.count);
  const cov={};
  results.filter(r=>r.kind==='flow').forEach(r=>{const k=r.sc==='direct'?'direct '+r.tag:r.sc;const c=cov[k.startsWith('direct')?'Direct':k]=cov[k.startsWith('direct')?'Direct':k]||{runs:0,pass:0,fail:0,finding:0};c.runs++;c[r.status]++});
  const tally={pass:0,fail:0,finding:0};results.forEach(r=>tally[r.status]++);
  return{findings,cov,tally}}
function buildReport(passes,cfg,meta){
  const P=passes.map(p=>({key:p.key,label:p.key==='current'?'Current build':'Proposed fixes',results:p.results,...summarize(p.results)}));
  let compare=null;
  if(P.length===2){const a=P[0],b=P[1],keys=new Set([...a.findings.map(f=>f.key),...b.findings.map(f=>f.key)]);
    compare=[...keys].map(k=>{const x=a.findings.find(f=>f.key===k),y=b.findings.find(f=>f.key===k);
      return{key:k,cur:x?x.count:0,pro:y?y.count:0,verdict:x&&!y?'Resolved':x&&y?'Still open':'New'}}).sort((p,q)=>SEVR[FX[p.key].sev]-SEVR[FX[q.key].sev]||q.cur-p.cur)}
  return{cfg,meta,passes:P,compare}}

if(typeof module!=='undefined')module.exports={makeEngine,buildPlan,runCase,buildReport,PACKS,PROBES,FX,RULESETS,RULE_LABELS,PROPOSED,specFor,CAT0,CUR0,EXTRA0};

function bootLines(R){const p=PACKS[R.cfg.pack];return[

async function bootSeq(R){

const COLS={pass:'p',finding:'f',fail:'x'};
async function launch(){
  if(RUN&&RUN.active)return;
  const cfg=cfgNorm(),plan=buildPlan(cfg),ps=passesOf(cfg);
  RUN={active:true,paused:false,stop:false,cfg,plan,ps,total:plan.length*ps.length,done:0,speed:cfg.speed,tally:{pass:0,finding:0,fail:0},issues:new Set(),feed:[]};
  const R=RUN;VIEW='boot';render();

function paint(R,pass,i,t){
  const pc=Math.round(R.done/R.total*100);
  $('#r-n').textContent=String(R.done).padStart(String(R.total).length,'0');
  $('#r-pct').textContent=pc+'%';$('#r-fill').style.width=pc+'%';
  $('#r-lb').setAttribute('aria-valuenow',R.done);
  const el=Date.now()-R.t0,rem=R.done?el/R.done*(R.total-R.done):0;
  $('#r-meta').textContent='Elapsed '+fmt(el)+' · about '+fmt(rem)+' left · '+(RUN.paused?'paused':RUN.speed+' speed');
  $('#s-p').textContent=R.tally.pass;$('#s-f').textContent=R.tally.finding;$('#s-x').textContent=R.tally.fail;$('#s-i').textContent=R.issues.size;
  $('#r-pass').textContent='Pass '+(pass+1)+' of '+R.ps.length+' · '+(R.ps[pass]==='current'?'Current build':'Proposed fixes');
  $('#r-mxl').textContent=Math.min(i+1,R.plan.length)+' / '+R.plan.length;

function feedAdd(res,R){
  const ul=$('#r-feed');if(!ul)return;const li=document.createElement('li');li.className=COLS[res.status];
  li.innerHTML='<b>'+res.id+'</b><span>'+esc(res.status==='pass'?'passed · '+res.title:res.status==='fail'?'FAILED · '+res.title:'finding · '+res.findings.map(k=>FX[k].title).join('; '))+'</span>';
  ul.prepend(li);while(ul.children.length>8)ul.lastChild.remove()}
async function runLoop(R){
  R.t0=Date.now();const out=[];let stopped=false,reason='';
  outer:for(let p=0;p<R.ps.length;p++){
    const key=R.ps[p],rules=RULESETS[key],results=[];out.push({key,results});
    const cells=[...document.querySelectorAll('#r-mx span')];cells.forEach(c=>c.className='');
    R.tally={pass:0,finding:0,fail:0};R.issues=new Set();
    for(let i=0;i<R.plan.length;i++){
      while(R.paused&&!R.stop)await sleep(100);
      if(R.stop){stopped=true;reason='Stopped by the user';break outer}
      const t=R.plan[i];cells[i].className='c';
      if(R.speed==='slow'){paint(R,p,i,t);await sleep(Math.min(120,DELAY.slow/2))}
      const res=runCase(t,rules);results.push(res);R.done++;R.tally[res.status]++;res.findings.forEach(k=>R.issues.add(k));
      cells[i].className=COLS[res.status];feedAdd(res,R);
      if(R.speed!=='turbo'||i%4===0||i===R.plan.length-1)paint(R,p,i,t);
      if(R.cfg.stopFail&&res.status==='fail'){stopped=true;reason='Stopped at the first failed check ('+res.id+')';break outer}
      if(R.speed==='turbo'){if(i%4===3)await sleep(0)}else await sleep(R.speed==='slow'?DELAY.slow/2:DELAY.normal)}}
  R.active=false;
  const ms=Date.now()-R.t0,keep=out.filter(o=>o.results.length);
  if(!keep.length){VIEW='setup';RUN=null;render();toast('Stopped before any case finished');return}
  REPORT=buildReport(keep,R.cfg,{date:new Date().toLocaleString(),ms,stopped,reason,total:R.total,done:R.done});
  AI=null;aiState='idle';persist();RUN=null;VIEW='report';render();window.scrollTo({top:0,behavior:'smooth'});
  toast(stopped?'Stopped. Partial report is ready':'Run complete. Report is ready')}

const arr=x=>Array.isArray(x)?x:[];
function aiHTML(){

  if(AI){const a=AI;return '<div class="ai">'+(a.summary?'<p>'+esc(a.summary)+'</p>':'')
   +(arr(a.top_risks).length?'<h3>Top risks</h3><ol>'+arr(a.top_risks).map(x=>'<li><b>'+esc(x.title)+'.</b> '+esc(x.why)+'</li>').join('')+'</ol>':'')
   +(arr(a.recommendations).length?'<h3>What to add to the flow</h3><ol>'+arr(a.recommendations).map(x=>'<li><span class="pill '+(x.priority==='Now'?'bad':x.priority==='Later'?'':'warn')+'">'+esc(x.priority||'Next')+'</span> <b>'+esc(x.title)+'.</b> '+esc(x.detail)+'</li>').join('')+'</ol>':'')
   +(arr(a.untested_edge_cases).length?'<h3>Edge cases to test next</h3><ul>'+arr(a.untested_edge_cases).map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>':'')
   +'<p class="sub">Written by Claude from this run\'s results. Review before sharing.</p></div>'}
  if(aiState==='off')return '<p class="sub">Claude\'s analysis is not available in this view. The issues and recommendations above are complete without it.</p>';
  if(aiState==='err')return '<p class="sub">'+esc(aiErr)+'</p><div style="margin-top:10px"><button class="btn sm" data-a="ai">Try again</button></div>';

async function runAI(){
  if(aiState==='busy'||!REPORT)return;aiState='busy';render();
  let sample=null;try{sample=window.claude&&window.claude.use?await window.claude.use('sample'):null}catch(e){}
  if(!sample){aiState='off';render();return}
  const rp=REPORT,M=rp.passes[0];
  const data={pack:PACKS[rp.cfg.pack].name,cases_per_pass:M.results.length,tally:M.tally,route_coverage:M.cov,
    findings:M.findings.map(f=>({title:FX[f.key].title,severity:FX[f.key].sev,type:FX[f.key].type,cases:f.count,evidence:f.ev,built_in_recommendation:FX[f.key].rec})),
    proposed_fix_impact:rp.compare?rp.compare.map(c=>({title:FX[c.key].title,current_cases:c.cur,with_proposed_fixes:c.pro,result:c.verdict})):null,
    failed_checks:M.results.filter(r=>r.status==='fail').slice(0,10).map(r=>({id:r.id,title:r.title,failed:r.checks.filter(c=>!c.ok).map(c=>c.msg)})),
    not_built_yet:['A2, D2, S2 office-closed variants','S4 conflict rollback']};
  const prompt='You are a QA lead reviewing automated test results for a college class add/drop/swap approval prototype. Routes: A1 blocked add goes to the Department Chair; A3 late add goes to the Instructor; D1 drop of a class with a hold goes to the Chair; D3 late drop goes to the Dean of Students (if denied the student picks a W with no refund or keeps the class); S1 blocked swap goes to the Chair; S3 late swap goes to the Instructor then the Dean. '
   +'Using only the data below, write for the project team. Return JSON only, no markdown: {"summary": string (3 to 4 plain sentences), "top_risks": [{"title": string, "why": string}] (3 to 5, most serious first), "untested_edge_cases": [string] (4 to 6 cases this run did not cover that could stop the flow), "recommendations": [{"title": string, "detail": string, "priority": "Now" | "Next" | "Later"}] (5 to 8 concrete additions to the process flow)}.\n\nDATA:\n'+JSON.stringify(data);
  try{let out;
    if(typeof sample.json==='function')out=await sample.json(prompt,{modelTier:'default'});else{const r=await sample(prompt,{modelTier:'default'});out=r.text}
    if(typeof out==='string')out=JSON.parse(out.replace(/^\s*```(json)?/,'').replace(/```\s*$/,''));
    if(!out||typeof out!=='object')throw new Error('empty');AI=out;aiState='idle';persist()}
  catch(e){const c=e&&e.code;aiState=c==='not_granted'?'off':'err';aiErr=c==='rate_limited'?'Claude is busy right now. Try again in a minute.':'Claude could not finish the analysis this time.'}
  render()}
function reportMD(rp){
  const M=rp.passes[0],m=rp.meta,t=M.tally,L=[];
  L.push('# Class Changes selftest report','',m.date+' · seed '+rp.cfg.seed+' · pack: '+PACKS[rp.cfg.pack].name+' · '+rp.passes.map(p=>p.label).join(' + ')+' · '+fmt(m.ms)+(m.stopped?' · '+m.reason:''),'',
   M.results.length+' cases per pass. Passed '+t.pass+', with findings '+t.finding+', failed a check '+t.fail+'. Distinct issues: '+M.findings.length+'.','');
  if(rp.compare){L.push('## Fix impact','','| Issue | Severity | Current build | Proposed fixes | Result |','|---|---|---|---|---|');rp.compare.forEach(c=>L.push('| '+FX[c.key].title+' | '+FX[c.key].sev+' | '+c.cur+' | '+c.pro+' | '+c.verdict+' |'));L.push('')}

  if(AI){const a=AI;L.push("## Claude's analysis",'',a.summary||'','');
    if(arr(a.top_risks).length){L.push('Top risks:');arr(a.top_risks).forEach((x,i)=>L.push((i+1)+'. '+x.title+': '+x.why));L.push('')}
    if(arr(a.recommendations).length){L.push('What to add to the flow:');arr(a.recommendations).forEach((x,i)=>L.push((i+1)+'. ['+(x.priority||'Next')+'] '+x.title+': '+x.detail));L.push('')}
    if(arr(a.untested_edge_cases).length){L.push('Edge cases to test next:');arr(a.untested_edge_cases).forEach(x=>L.push('- '+x));L.push('')}}
  L.push('## All cases','','| ID | Scenario | Route | Decisions | '+(rp.passes[1]?'Current | Proposed':'Result')+' | Notes |','|---|---|---|---|'+(rp.passes[1]?'---|---|':'---|')+'---|');

  return L.join('\n')}

  const nv=e.target.closest('.nav button');if(nv&&!nv.disabled){VIEW=nv.dataset.v==='report'?'report':'setup';render();window.scrollTo(0,0);return}
  const pc=e.target.closest('[data-preset]');if(pc){CFG.count=+pc.dataset.preset;CFG.seed=Math.floor(Math.random()*90000)+10000;persist();render();return}
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='launch'){persist();launch()}
  else if(a==='rand'){CFG.seed=Math.floor(Math.random()*90000)+10000;$('#seed').value=CFG.seed;persist();updatePreview()}
  else if(a==='pause'&&RUN){RUN.paused=!RUN.paused;el.textContent=RUN.paused?'Resume':'Pause';const s=$('#r-state');s.textContent=RUN.paused?'Paused':'Running';s.classList.toggle('paused',RUN.paused)}
  else if(a==='stop'&&RUN){RUN.stop=true;RUN.paused=false}
  else if(a==='again'){VIEW='setup';render();window.scrollTo(0,0)}
  else if(a==='ai')runAI();
  else if(a==='copy'&&REPORT){const md=reportMD(REPORT),ta=$('#md');
    const fb=()=>{ta.hidden=false;ta.value=md;ta.focus();ta.select();toast('Select all and copy the text below')};
    try{navigator.clipboard.writeText(md).then(()=>toast('Report copied as Markdown'),fb)}catch(x){fb()}}
  else if(a==='save'&&REPORT&&DL){const md=reportMD(REPORT),fn='class-changes-selftest-'+REPORT.cfg.seed+'.md';
    DL.save({filename:fn,data:md}).then(()=>toast('Saved '+fn)).catch(x=>{if(x&&x.code==='cancelled')return;toast('The file was not saved. Use Copy report instead.')})}});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(e.target.type==='range'&&RANGES.includes(id)){CFG[id]=+e.target.value;const o=$('#'+id+'-o');if(o)o.textContent=e.target.value+e.target.dataset.unit;e.target.style.setProperty('--p',pct(+e.target.value,+e.target.min,+e.target.max)+'%');updatePreview()}});
const RANGES=['count','late','closed','fail','burst','unavail'];
document.addEventListener('change',e=>{
  const t=e.target,id=t.id;if(VIEW==='run'&&t.name==='livespeed'){RUN.speed=t.value;return}
  if(id==='pack'){CFG.pack=t.value;const d=PACKS[t.value].def;CFG.burst=d.burst;CFG.closed=d.closed;CFG.fail=d.fail;CFG.extra=d.extra;CFG.types=d.types==='swap'?{add:false,drop:false,swap:true}:{add:true,drop:true,swap:true};persist();render()}
  else if(id==='seed'){CFG.seed=parseInt(t.value)||CFG.seed;t.value=CFG.seed;persist();updatePreview()}
  else if(id&&id.startsWith('t-')){CFG.types[id.slice(2)]=t.checked;if(!CFG.types.add&&!CFG.types.drop&&!CFG.types.swap){CFG.types[id.slice(2)]=true;t.checked=true;toast('Keep at least one request type')}persist();updatePreview()}
  else if(id==='extra'){CFG.extra=t.checked;persist();updatePreview()}
  else if(id==='stopFail'){CFG.stopFail=t.checked;persist()}
  else if(t.type==='radio'&&['speed','approve','blank','rules'].includes(t.name)){CFG[t.name]=t.value;persist();updatePreview()}
  else if(RANGES.includes(id))persist()});
(async()=>{try{if(window.claude&&window.claude.use){DL=await window.claude.use('downloads');if(VIEW==='report')render()}}catch(e){}})();
if(!REPORT)document.querySelector('.nav [data-v="report"]').disabled=true;
render();

})();
</script>
